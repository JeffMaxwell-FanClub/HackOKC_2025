<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Maintenance - Submit Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navigation Header -->
    <nav class="bg-white shadow-md border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-800 text-white p-2 rounded-lg">
                        <i class="fa-solid fa-building-columns"></i>
                    </div>
                    <span class="font-bold text-xl text-slate-800 tracking-tight">CampusFix</span>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="goToDashboard()" class="text-blue-700 hover:text-blue-800 font-medium flex items-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Back to Dashboard</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex-grow flex items-center justify-center p-4 py-8">
        <div class="w-full max-w-2xl bg-white rounded-xl shadow-xl overflow-hidden fade-in">
            <div class="bg-blue-900 p-6 text-center">
                <h2 class="text-2xl font-bold text-white">Submit Maintenance Request</h2>
                <p class="text-blue-200 text-sm mt-1">Report a campus maintenance issue</p>
            </div>

            <div class="p-8">
                <form id="maintenanceForm">

                    <!-- CATEGORY -->
                    <div class="mb-5">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Issue Category *</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                <i class="fa-solid fa-wrench"></i>
                            </span>
                            <input type="text" id="category" required
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                placeholder="e.g., Electrical, Plumbing, HVAC">
                        </div>
                    </div>

                    <!-- LOCATION -->
                    <div class="mb-5">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Location *</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                <i class="fa-solid fa-map-marker-alt"></i>
                            </span>
                            <input type="text" id="location" required
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                placeholder="e.g., Student Center, Room 205">
                        </div>
                    </div>

                    <!-- DESCRIPTION -->
                    <div class="mb-5">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Description *</label>
                        <textarea id="description" rows="5" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 resize-none"
                            placeholder="Describe the issue..."></textarea>
                    </div>

                    <!-- PRIORITY -->
                    <div class="mb-5">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Priority *</label>
                        <select id="priority" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="1">Low</option>
                            <option value="2">Medium</option>
                            <option value="3">High</option>
                        </select>
                    </div>

                    <!-- IMAGE UPLOAD -->
                    <div class="mb-5">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Attach Image (Optional)</label>
                        <input type="file" id="imageUpload" accept="image/*"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg file:bg-blue-50 file:text-blue-700" >
                        <div id="imagePreview" class="mt-3 hidden">
                            <img id="previewImg" class="max-w-xs rounded-lg border">
                        </div>
                    </div>

                    <!-- Message -->
                    <div id="message" class="hidden mb-4 p-3 text-sm rounded-lg border"></div>

                    <!-- Actions -->
                    <div class="flex gap-3">
                        <button type="submit"
                            class="flex-1 bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 rounded-lg shadow-md">
                            <i class="fa-solid fa-paper-plane mr-2"></i>
                            Submit Request
                        </button>
                        <button type="button" onclick="goToDashboard()"
                            class="px-6 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 rounded-lg">
                            Cancel
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

<script>
/* ---------------- AUTH CHECK ---------------- */
function checkAuth() {
    const currentUserStr = localStorage.getItem('currentUser');
    if (!currentUserStr) return window.location.href = '/';

    try {
        const currentUser = JSON.parse(currentUserStr);
        return currentUser;
    } catch {
        return window.location.href = '/';
    }
}

const currentUser = checkAuth();

/* ---------------- IMAGE PREVIEW ---------------- */
document.getElementById('imageUpload').addEventListener('change', e => {
    const file = e.target.files[0];
    const preview = document.getElementById('imagePreview');
    const img = document.getElementById('previewImg');

    if (!file) return preview.classList.add('hidden');

    const reader = new FileReader();
    reader.onload = ev => {
        img.src = ev.target.result;
        preview.classList.remove('hidden');
    };
    reader.readAsDataURL(file);
});

/* ---------------- FORM SUBMIT ---------------- */
document.getElementById('maintenanceForm').addEventListener('submit', e => {
    e.preventDefault();

    const category = document.getElementById('category').value;
    const location = document.getElementById('location').value;
    const description = document.getElementById('description').value;
    const priority = parseInt(document.getElementById('priority').value);
    const fileInput = document.getElementById('imageUpload');
    const timestamp = new Date().toISOString();

    if (fileInput.files.length > 0) {
        const reader = new FileReader();
        reader.onload = ev => {
            const base64 = ev.target.result.split(',')[1];
            saveReport(category, location, description, priority, timestamp, base64);
        };
        reader.readAsDataURL(fileInput.files[0]);
    } else {
        saveReport(category, location, description, priority, timestamp, null);
    }
});

/* ---------------- SAVE REPORT (DB ALIGNED) ---------------- */
function saveReport(category, location, description, priority, timestamp, imageBinary) {
    console.log("test")
    const report = {
        location: location,
        category: category,
        description: description,
        priority: priority,
        submissionTime: timestamp,
        completion: 0,
        deleted: 0,
        img: imageBinary,
        userID: currentUser.id
    };

    fetch('/API/createReport', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(report)
    })
    .then(res => res.json())
    .then(data => {
        const msg = document.getElementById('message');
        msg.textContent = "Report submitted successfully!";
        msg.className = "mb-4 p-3 bg-green-50 text-green-700 rounded-lg border border-green-200";
        msg.classList.remove('hidden');

        document.getElementById('maintenanceForm').reset();
        document.getElementById('imagePreview').classList.add('hidden');
    })
    .catch(err => console.error(err));
}

/* ---------------- NAVIGATION ---------------- */
function goToDashboard() {
    window.location.href = '/';
}
</script>

</body>
</html>
