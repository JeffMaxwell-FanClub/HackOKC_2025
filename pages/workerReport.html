<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Maintenance Requests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>

<body class="bg-gray-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <nav class="bg-white shadow-md border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-800 text-white p-2 rounded-lg">
                        <i class="fa-solid fa-star"></i>
                    </div>
                    <span class="font-bold text-xl text-slate-800 tracking-tight">CampusFix - Worker Portal</span>
                </div>
                <div class="flex items-center gap-4">
                    <span id="worker-name" class="text-sm text-gray-600"></span>
                    <a href="/" class="text-blue-700 hover:text-blue-800 font-medium">Dashboard</a>
                    <button onclick="handleLogout()" class="text-red-600 hover:text-red-700 font-medium underline">Log Out</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main -->
    <div class="flex-grow p-6">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">Maintenance Requests</h1>

            <!-- Tabs -->
            <div class="flex gap-3 mb-6">
                <button id="tab-all"
                    class="px-4 py-2 bg-blue-700 text-white rounded-lg shadow hover:bg-blue-800">All Requests</button>
                <button id="tab-assigned"
                    class="px-4 py-2 bg-blue-700 text-white rounded-lg shadow hover:bg-blue-800">My Assigned
                    Requests</button>
                <button id="tab-completed"
                    class="px-4 py-2 bg-blue-700 text-white rounded-lg shadow hover:bg-blue-800">Completed
                    Requests</button>
            </div>

            <!-- Panels -->
            <section id="allRequests" class="space-y-6"></section>
            <section id="assignedRequests" class="space-y-6 hidden"></section>
            <section id="completedRequests" class="space-y-6 hidden"></section>
        </div>
    </div>

    <script>
        async function allReqs(){
            // console.log("All Requests Clicked");
            try {
                const response = await fetch('/API/allReports', {
                    method: 'GET'
                });
                const data = await response.json();
                console.log('Response:', data);
            } catch (error) {
                console.error('Error:', error);
            }
        }
        document.getElementById("tab-all").addEventListener("click", allReqs);
            
        async function myAssignedReports(){
        //    console.log("My Assigned Requests Clicked");
            try {
                const response = await fetch('/API/assignedReports', {
                    method: 'GET'
                });
                const data = await response.json();
                console.log('Response:', data);
            } catch (error) {
                console.error('Error:', error);
            }
        }
        document.getElementById("tab-assigned").addEventListener("click", myAssignedReports);

        async function completedReqs(){
        //    console.log("Completed Requests Clicked");
            try {
                const response = await fetch('/API/completedReports', {
                    method: 'GET'
                });
                const data = await response.json();
                console.log('Response:', data);
            } catch (error) {
                console.error('Error:', error);
            }
        }
        document.getElementById("tab-completed").addEventListener("click", completedReqs);
    </script>
