<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Maintenance Requests</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body class="bg-gray-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <nav class="bg-white shadow-md border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center gap-3">
          <div class="bg-blue-800 text-white p-2 rounded-lg">
            <i class="fa-solid fa-star"></i>
          </div>
          <span class="font-bold text-xl text-slate-800 tracking-tight">CampusFix - Worker Portal</span>
        </div>
        <div class="flex items-center gap-4">
          <span id="worker-name" class="text-sm text-gray-600"></span>
          <a href="/" class="text-blue-700 hover:text-blue-800 font-medium">Dashboard</a>
          <button onclick="handleLogout()" class="text-red-600 hover:text-red-700 font-medium underline">Log Out</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main -->
  <div class="flex-grow p-6">
    <div class="max-w-6xl mx-auto">
      <h1 class="text-2xl font-bold text-gray-800 mb-6">Maintenance Requests</h1>

      <!-- Tabs -->
      <div class="flex gap-3 mb-6">
        <button id="tab-all" class="px-4 py-2 bg-blue-700 text-white rounded-lg shadow hover:bg-blue-800">All Requests</button>
        <button id="tab-assigned" class="px-4 py-2 bg-blue-700 text-white rounded-lg shadow hover:bg-blue-800">My Assigned Requests</button>
        <button id="tab-completed" class="px-4 py-2 bg-blue-700 text-white rounded-lg shadow hover:bg-blue-800">Completed Requests</button>
      </div>

      <!-- Panels -->
      <section id="allRequests" class="space-y-6"></section>
      <section id="assignedRequests" class="space-y-6 hidden"></section>
      <section id="completedRequests" class="space-y-6 hidden"></section>
    </div>
  </div>

  <script>
    // Helper: get worker ID (replace with real login/session logic)
    function getWorkerID() {
      return localStorage.getItem("workerID") || 1; // fallback for testing
    }

    // Card builder
    function createReportCard(report, isAssigned = false) {
      const submissionDate = new Date(report.submissionTime).toLocaleString();
      const priorityColors = {
        1: "bg-green-100 text-green-800",
        2: "bg-yellow-100 text-yellow-800",
        3: "bg-red-100 text-red-800"
      };

      return `
        <div class="bg-white shadow-md rounded-lg p-4 border border-gray-200" id="report-${report.reportID}">
          <div class="flex justify-between items-center mb-2">
            <h2 class="text-lg font-semibold text-gray-800">Report #${report.reportID}</h2>
            <span class="px-2 py-1 text-xs font-medium rounded ${priorityColors[report.priority]}">
              Priority ${report.priority}
            </span>
          </div>
          <p class="text-sm text-gray-600"><strong>Location:</strong> ${report.location}</p>
          <p class="text-sm text-gray-600"><strong>Category:</strong> ${report.category}</p>
          <p class="text-sm text-gray-600"><strong>Description:</strong> ${report.description}</p>
          <p class="text-sm text-gray-600"><strong>Submitted:</strong> ${submissionDate}</p>
          <p class="text-sm text-gray-600"><strong>Status:</strong> ${report.completion ? "Completed ✅" : "Pending ⏳"}</p>
          ${!isAssigned ? `
            <button onclick="acceptRequest(${report.reportID})"
              class="mt-3 px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700">
              Accept Request
            </button>` : ""}
        </div>
      `;
    }

    // Global storage
    let currentReports = [];

    // Accept request
    async function acceptRequest(reportID) {
      const workerID = getWorkerID();

      try {
        const response = await fetch('/API/assignReport', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ workerID, reportID })
        });

        const result = await response.json();
        if (result.success) {
          document.getElementById(`report-${reportID}`).remove();
          const report = currentReports.find(r => r.reportID === reportID);
          document.getElementById("assignedRequests").innerHTML += createReportCard(report, true);
        } else {
          console.error("Assignment failed:", result.error);
        }
      } catch (error) {
        console.error("Error assigning report:", error);
      }
    }

    // Load all reports
    async function allReqs() {
      try {
        const response = await fetch('/API/allReports');
        const data = await response.json();
        const container = document.getElementById("allRequests");
        container.innerHTML = "";

        if (data.success && data.reports.length > 0) {
          currentReports = data.reports;
          data.reports.forEach(report => {
            container.innerHTML += createReportCard(report);
          });
        } else {
          container.innerHTML = `<p class="text-gray-600">No reports found.</p>`;
        }
      } catch (error) {
        console.error('Error:', error);
      }
    }

    // Load assigned reports
    async function myAssignedReports() {
      const workerID = getWorkerID();
      try {
        const response = await fetch(`/API/assignedReports?workerID=${workerID}`);
        const data = await response.json();
        const container = document.getElementById("assignedRequests");
        container.innerHTML = "";

        if (data.success && data.assigned.length > 0) {
          data.assigned.forEach(report => {
            container.innerHTML += createReportCard(report, true);
          });
        } else {
          container.innerHTML = `<p class="text-gray-600">No assigned reports.</p>`;
        }
      } catch (error) {
        console.error('Error:', error);
      }
    }

    // Load completed reports
    async function completedReqs() {
      try {
        const response = await fetch('/API/completedReports');
        const data = await response.json();
        const container = document.getElementById("completedRequests");
        container.innerHTML = "";

        if (data.success && data.completed.length > 0) {
          data.completed.forEach(report => {
            container.innerHTML += createReportCard(report, true);
          });
        } else {
          container.innerHTML = `<p class="text-gray-600">No completed reports.</p>`;
        }
      } catch (error) {
        console.error('Error:', error);
      }
    }

    // Tab switching
    document.getElementById("tab-all").addEventListener("click", () => {
      document.getElementById("allRequests").classList.remove("hidden");
      document.getElementById("assignedRequests").classList.add("hidden");
      document.getElementById("completedRequests").classList.add("hidden");
      allReqs();
    });

    document.getElementById("tab-assigned").addEventListener("click", () => {
      document.getElementById("allRequests").classList.add("hidden");
      document.getElementById("assignedRequests").classList.remove("hidden");
      document.getElementById("completedRequests").classList.add("hidden");
      myAssignedReports();
    });

    document.getElementById("tab-completed").addEventListener("click", () => {
      document.getElementById("allRequests").classList.add("hidden");
      document.getElementById("assignedRequests").classList.add("hidden");
      document.getElementById("completedRequests").classList.remove("hidden");
      completedReqs();
    });

    // Load All Requests by default
    allReqs();
  </script>
</body>
</html>
