<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Maintenance Requests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>

<body class="bg-gray-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <nav class="bg-white shadow-md border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-800 text-white p-2 rounded-lg">
                        <i class="fa-solid fa-star"></i>
                    </div>
                    <span class="font-bold text-xl text-slate-800 tracking-tight">CampusFix - Worker Portal</span>
                </div>
                <div class="flex items-center gap-4">
                    <span id="worker-name" class="text-sm text-gray-600"></span>
                    <a href="/" class="text-blue-700 hover:text-blue-800 font-medium">Dashboard</a>
                    <button onclick="handleLogout()" class="text-red-600 hover:text-red-700 font-medium underline">Log Out</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main -->
    <div class="flex-grow p-6">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">Maintenance Requests</h1>

            <!-- Tabs -->
            <div class="flex gap-3 mb-6">
                <button onclick="showList('all')" id="tab-all"
                    class="px-4 py-2 bg-blue-700 text-white rounded-lg shadow hover:bg-blue-800">All Requests</button>
                <button onclick="showList('assigned')" id="tab-assigned"
                    class="px-4 py-2 bg-blue-700 text-white rounded-lg shadow hover:bg-blue-800">My Assigned
                    Requests</button>
                <button onclick="showList('completed')" id="tab-completed"
                    class="px-4 py-2 bg-blue-700 text-white rounded-lg shadow hover:bg-blue-800">Completed
                    Requests</button>
            </div>

            <!-- Panels -->
            <section id="allRequests" class="space-y-6"></section>
            <section id="assignedRequests" class="space-y-6 hidden"></section>
            <section id="completedRequests" class="space-y-6 hidden"></section>
        </div>
    </div>

    <script>
        // Check authentication
        function checkAuth() {
            try {
                const currentUserStr = localStorage.getItem('currentUser');
                if (!currentUserStr) {
                    alert('Please log in first');
                    window.location.href = '/';
                    return null;
                }
                
                const currentUser = JSON.parse(currentUserStr);
                const users = JSON.parse(localStorage.getItem('campusUsers')) || [];
                
                if (!users.find(u => u.email === currentUser.email)) {
                    alert('User not found. Please log in again.');
                    window.location.href = '/';
                    return null;
                }
                
                // Check if user is maintenance staff
                if (currentUser.role !== 'maintenance') {
                    alert('Access denied. This page is for maintenance staff only.');
                    window.location.href = '/';
                    return null;
                }
                
                // Display worker name
                document.getElementById('worker-name').textContent = `Logged in as: ${currentUser.name}`;
                
                return currentUser;
            } catch (error) {
                console.error('Error checking auth:', error);
                window.location.href = '/';
                return null;
            }
        }

        const currentWorker = checkAuth();
        if (!currentWorker) {
            // Will redirect, but just in case
            throw new Error('Authentication failed');
        }

        // Load reports from localStorage
        function loadReports() {
            const reports = JSON.parse(localStorage.getItem('campusReports')) || [];
            
            // Convert to the format expected by the UI
            return reports.map(report => {
                // Get submitter info from users
                const users = JSON.parse(localStorage.getItem('campusUsers')) || [];
                const submitter = users.find(u => u.email === report.userId) || { name: report.userName || 'Unknown', email: report.userId };
                
                return {
                    id: report.id,
                    category: report.type || 'General',
                    description: report.description || '',
                    location: report.location || '',
                    submitted: report.formattedTime || new Date(report.timestamp).toLocaleString(),
                    priority: report.priority || 'Medium',
                    assignedTo: report.assignedTo || null,
                    completedBy: report.completedBy || null,
                    completionNotes: report.completionNotes || null,
                    status: report.status || 'pending',
                    submitter: {
                        name: submitter.name,
                        email: submitter.email || report.userId,
                        phone: submitter.phone || 'N/A'
                    },
                    imageData: report.imageData || null,
                    imageFileName: report.imageFileName || null
                };
            });
        }

        // Initialize data
        let requests = loadReports().filter(r => r.status === 'pending' && !r.assignedTo);
        let assignedRequests = loadReports().filter(r => r.assignedTo === currentWorker.name && r.status !== 'completed');
        let completedRequests = loadReports().filter(r => r.status === 'completed');

        // Renderers
        function renderCard(req, containerId) {
            const card = document.createElement("article");
            card.className = "bg-white rounded-xl shadow-md p-6";

            card.innerHTML = `
        <div class="flex items-start justify-between">
          <h2 class="font-bold text-lg text-gray-800">${req.category} Issue</h2>
          <span class="text-xs px-2 py-1 rounded-full ${priorityClass(req.priority)}">${req.priority}</span>
        </div>

        <p class="text-gray-600 mt-2"><i class="fa-solid fa-location-dot text-blue-600 mr-2"></i>${req.location}</p>
        <p class="text-gray-600 mt-1"><i class="fa-solid fa-circle-info text-blue-600 mr-2"></i>${req.description}</p>
        <p class="text-sm text-gray-500 mt-2">Submitted: ${req.submitted}</p>
        <p class="text-sm text-gray-500">Submitted By: ${req.submitter.name}</p>
        ${req.imageData ? `<div class="mt-3"><img src="${req.imageData}" alt="Report Image" class="max-w-xs rounded-lg border border-gray-300"></div>` : ''}

        <div id="contact-${req.id}" class="hidden mt-2 text-sm text-gray-600">
          <p><strong>Phone:</strong> ${req.submitter.phone}</p>
          <p><strong>Email:</strong> ${req.submitter.email}</p>
        </div>
      `;

            // Buttons under contact info
            const btns = document.createElement("div");
            btns.className = "mt-4 flex flex-wrap gap-2";

            const contactBtn = document.createElement("button");
            contactBtn.textContent = "Show Contact Info";
            contactBtn.className = "text-blue-700 font-semibold hover:underline";
            contactBtn.onclick = () => toggleContactInfo(req.id, contactBtn);
            btns.appendChild(contactBtn);

            // Assign only in All Requests when unassigned
            if (containerId === "allRequests" && !req.assignedTo) {
                const assignBtn = document.createElement("button");
                assignBtn.textContent = "Assign to Me";
                assignBtn.className = "px-4 py-2 bg-green-600 text-white rounded-lg shadow hover:bg-green-700";
                assignBtn.onclick = () => assignToMe(req);
                btns.appendChild(assignBtn);
            }

            // Release + Complete only in Assigned Requests
            if (containerId === "assignedRequests" && req.assignedTo) {
                const releaseBtn = document.createElement("button");
                releaseBtn.textContent = "Release Request";
                releaseBtn.className = "px-4 py-2 bg-yellow-500 text-white rounded-lg shadow hover:bg-yellow-600";
                releaseBtn.onclick = () => releaseRequest(req);
                btns.appendChild(releaseBtn);

                const completeBtn = document.createElement("button");
                completeBtn.textContent = "Mark as Completed";
                completeBtn.className = "px-4 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700";
                completeBtn.onclick = () => showCompletionBox(req, card);
                btns.appendChild(completeBtn);
            }

            card.appendChild(btns);

            // Completed info
            if (req.completedBy) {
                const completedBlock = document.createElement("div");
                completedBlock.className = "mt-3 border-t pt-3";
                completedBlock.innerHTML = `
          <p class="text-sm text-gray-500">Completed By: ${req.completedBy}</p>
          <p class="text-sm text-gray-700 mt-1"><strong>Completion Notes:</strong> ${req.completionNotes}</p>
        `;
                card.appendChild(completedBlock);
            }

            return card;
        }

        function renderPanel(containerId, list, showAssignButton) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";
            list.forEach(req => container.appendChild(renderCard(req, containerId)));
        }

        // Helpers
        function priorityClass(p) {
            if (p === "High") return "bg-red-100 text-red-700 border border-red-200";
            if (p === "Medium") return "bg-yellow-100 text-yellow-700 border border-yellow-200";
            return "bg-green-100 text-green-700 border border-green-200";
        }

        function toggleContactInfo(id, button) {
            const div = document.getElementById(`contact-${id}`);
            div.classList.toggle("hidden");
            button.textContent = div.classList.contains("hidden") ? "Show Contact Info" : "Hide Contact Info";
        }

        function showCompletionBox(req, parentCard) {
            if (parentCard.querySelector("textarea")) return;

            const textarea = document.createElement("textarea");
            textarea.placeholder = "Enter how you fixed the problem...";
            textarea.rows = 3;
            textarea.className = "w-full border border-gray-300 rounded-lg p-2 mt-3";

            const submitBtn = document.createElement("button");
            submitBtn.textContent = "Submit Completion Report";
            submitBtn.className = "mt-2 px-4 py-2 bg-blue-700 text-white rounded-lg shadow hover:bg-blue-800";
            submitBtn.onclick = () => markCompleted(req, textarea.value);

            parentCard.appendChild(textarea);
            parentCard.appendChild(submitBtn);
        }

        // Tab toggle: no re-render here (avoids breaking handlers)
        function showList(listType) {
            document.getElementById('allRequests').classList.add('hidden');
            document.getElementById('assignedRequests').classList.add('hidden');
            document.getElementById('completedRequests').classList.add('hidden');
            document.getElementById(listType + 'Requests').classList.remove('hidden');

            // Update tab styling
            const tabs = ['all', 'assigned', 'completed'];
            tabs.forEach(tab => {
                const tabEl = document.getElementById(`tab-${tab}`);
                if (tab === listType) {
                    tabEl.classList.remove('bg-blue-700');
                    tabEl.classList.add('bg-blue-800', 'ring-2', 'ring-blue-400');
                } else {
                    tabEl.classList.remove('bg-blue-800', 'ring-2', 'ring-blue-400');
                    tabEl.classList.add('bg-blue-700');
                }
            });
        }

        // Update report in localStorage
        function updateReportInStorage(req) {
            const reports = JSON.parse(localStorage.getItem('campusReports')) || [];
            const index = reports.findIndex(r => r.id === req.id);
            
            if (index !== -1) {
                // Update existing report
                reports[index] = {
                    ...reports[index],
                    assignedTo: req.assignedTo,
                    completedBy: req.completedBy,
                    completionNotes: req.completionNotes,
                    status: req.status,
                    priority: req.priority
                };
            } else {
                // Create new report entry (shouldn't happen, but just in case)
                reports.push({
                    id: req.id,
                    userId: req.submitter.email,
                    userName: req.submitter.name,
                    type: req.category,
                    location: req.location,
                    description: req.description,
                    timestamp: new Date(req.submitted).toISOString(),
                    formattedTime: req.submitted,
                    status: req.status,
                    assignedTo: req.assignedTo,
                    completedBy: req.completedBy,
                    completionNotes: req.completionNotes,
                    priority: req.priority,
                    imageData: req.imageData,
                    imageFileName: req.imageFileName
                });
            }
            
            localStorage.setItem('campusReports', JSON.stringify(reports));
        }

        // Actions
        function markCompleted(req, notes) {
            if (!notes.trim()) {
                alert("Completion notes are required.");
                return;
            }

            // Record completion info
            req.completedBy = req.assignedTo || currentWorker.name;
            req.completionNotes = notes;
            req.status = 'completed';

            // Update in localStorage
            updateReportInStorage(req);

            // Move request into completedRequests
            completedRequests.push(req);

            // Remove from assignedRequests if present
            const ai = assignedRequests.findIndex(r => r.id === req.id);
            if (ai !== -1) {
                assignedRequests.splice(ai, 1);
                renderPanel("assignedRequests", assignedRequests, false);
            }

            // Remove from allRequests if present
            const ri = requests.findIndex(r => r.id === req.id);
            if (ri !== -1) {
                requests.splice(ri, 1);
                renderPanel("allRequests", requests, true);
            }

            // Render completedRequests only
            renderPanel("completedRequests", completedRequests, false);

            // Switch to Completed tab so user sees it
            showList("completed");
        }


        function assignToMe(req) {
            req.assignedTo = currentWorker.name;
            req.status = 'assigned';
            
            // Update in localStorage
            updateReportInStorage(req);
            
            // Remove from requests, add to assigned
            const idx = requests.findIndex(r => r.id === req.id);
            if (idx !== -1) requests.splice(idx, 1);
            
            if (!assignedRequests.some(r => r.id === req.id)) {
                assignedRequests.push(req);
            }
            
            renderPanel("allRequests", requests, true);
            renderPanel("assignedRequests", assignedRequests, false);
            showList("assigned");
        }

        function releaseRequest(req) {
            req.assignedTo = null;
            req.status = 'pending';
            
            // Update in localStorage
            updateReportInStorage(req);
            
            const idx = assignedRequests.findIndex(r => r.id === req.id);
            if (idx !== -1) assignedRequests.splice(idx, 1);
            if (!requests.some(r => r.id === req.id)) requests.push(req);

            renderPanel("allRequests", requests, true);
            renderPanel("assignedRequests", assignedRequests, false);
            showList("all");
        }

        function handleLogout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/';
        }

        // Refresh reports periodically
        function refreshReports() {
            const allReports = loadReports();
            requests = allReports.filter(r => r.status === 'pending' && !r.assignedTo);
            assignedRequests = allReports.filter(r => r.assignedTo === currentWorker.name && r.status !== 'completed');
            completedRequests = allReports.filter(r => r.status === 'completed');
            
            renderPanel("allRequests", requests, true);
            renderPanel("assignedRequests", assignedRequests, false);
            renderPanel("completedRequests", completedRequests, false);
        }

        // Initial render
        refreshReports();
        showList("all");
        
        // Refresh every 30 seconds to catch new reports
        setInterval(refreshReports, 30000);
    </script>
</body>

</html>
