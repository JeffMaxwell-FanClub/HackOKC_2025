<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Fix Ops - Maintenance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
      body { font-family: 'Inter', sans-serif; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* List Item Interactions */
      .report-item { 
        transition: all 0.2s ease; 
        border-left: 3px solid transparent; 
      }
      .report-item:hover { 
        background-color: #f8fafc; 
      }
      .report-item.active { 
        background-color: #eff6ff; 
        border-left-color: #3b82f6; 
      }

      /* Smooth Map Transitions */
      path.leaflet-interactive {
        transition: fill 0.5s ease, fill-opacity 0.5s ease, stroke 0.5s ease; 
      }

      /* Toast Notifications */
      .toast-enter { transform: translateX(100%); opacity: 0; }
      .toast-enter-active { transform: translateX(0); opacity: 1; transition: all 0.3s ease-out; }

      /* Form Styling derived from example */
      .detail-input {
        transition: all 0.2s ease;
        background-color: #f8fafc; /* Slate-50 */
        border: 1px solid #e2e8f0; /* Slate-200 */
      }
      .detail-input:focus {
        background-color: #fff;
        border-color: #3b82f6;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
      }
    </style>
  </head>
  <body class="h-screen w-screen overflow-hidden bg-slate-50 flex flex-col">
    
    <!-- Header -->
    <header class="h-14 bg-slate-900 text-white flex items-center justify-between px-4 md:px-6 shadow-md z-30 shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-1.5 rounded text-white">
                <i class="fa-solid fa-star"></i>
            </div>
            <h1 class="font-bold text-sm tracking-wide hidden md:block">CAMPUS FIX OPS</h1>
            <h1 class="font-bold text-sm tracking-wide md:hidden">OPS</h1>
        </div>
        <div class="flex items-center gap-3 md:gap-4">
            <span class="text-xs text-slate-400 hidden md:inline" id="worker-status">Worker ID: <span id="display-worker-id" class="text-white font-mono">---</span></span>
            <button onclick="fetchReports()" class="text-xs text-blue-400 hover:text-white transition-colors flex items-center gap-1">
                <i class="fa-solid fa-sync"></i> <span class="hidden md:inline">Refresh</span>
            </button>
        </div>
    </header>

    <!-- Layout -->
    <div class="flex flex-1 flex-col md:flex-row overflow-hidden">
        
        <!-- Sidebar List -->
        <aside id="sidebar-panel" class="w-full md:w-80 flex flex-col bg-white border-r border-slate-200 z-20 h-full shadow-lg transition-transform">
            <div class="p-4 border-b border-slate-100 bg-white sticky top-0 z-10">
                <!-- Filter Tabs -->
                <div class="flex gap-1 mb-3 bg-slate-100 p-1 rounded-lg">
                    <button id="btn-filter-all" onclick="switchTab('all')" class="flex-1 py-1.5 text-[10px] font-bold rounded shadow-sm bg-white text-blue-700 transition-colors">All</button>
                    <button id="btn-filter-assigned" onclick="switchTab('assigned')" class="flex-1 py-1.5 text-[10px] font-bold rounded text-slate-500 hover:text-slate-700 transition-colors">My Tasks</button>
                    <button id="btn-filter-completed" onclick="switchTab('completed')" class="flex-1 py-1.5 text-[10px] font-bold rounded text-slate-500 hover:text-slate-700 transition-colors">Done</button>
                </div>
                <!-- Search Bar -->
                <div class="relative">
                    <input type="text" id="search-input" placeholder="Filter by ID or Location..." class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-9 pr-8 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-shadow">
                    <i class="fa-solid fa-search text-slate-400 absolute left-3 top-2.5 text-xs"></i>
                    <button id="clear-search" onclick="clearSearch()" class="hidden absolute right-2 top-2 text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-times-circle"></i>
                    </button>
                </div>
            </div>
            
            <!-- List Container -->
            <div id="report-list-container" class="flex-1 overflow-y-auto no-scrollbar relative bg-slate-50">
                <!-- Items injected via JS -->
                <div class="text-center p-8 text-slate-400 text-sm">Loading data...</div>
            </div>
        </aside>

        <!-- Main Viewer Area -->
        <main id="main-panel" class="flex-1 flex flex-col md:flex-row relative bg-slate-100 overflow-hidden hidden md:flex">
            
            <!-- Map Panel (60%) -->
            <div class="relative w-full md:w-[60%] h-48 md:h-full border-b md:border-b-0 md:border-r border-slate-200 bg-slate-200 shrink-0">
                <div id="map" class="h-full w-full z-0"></div>
                
                <!-- Mobile Back Button -->
                <button onclick="showMobileList()" class="md:hidden absolute top-4 left-4 z-[400] bg-white shadow-md px-3 py-2 rounded-lg border border-slate-200 text-slate-700 text-xs font-bold flex items-center gap-2 active:bg-slate-100">
                    <i class="fa-solid fa-arrow-left"></i> Back to List
                </button>

                <!-- Map Legend -->
                <div class="absolute bottom-4 left-4 z-[400] bg-white/90 backdrop-blur shadow-sm px-3 py-2 rounded-lg border border-slate-200 pointer-events-none text-[10px]">
                    <div class="flex items-center gap-2 mb-1"><span class="w-3 h-3 bg-red-500 rounded-sm opacity-60"></span> High Priority</div>
                    <div class="flex items-center gap-2 mb-1"><span class="w-3 h-3 bg-blue-500 rounded-sm opacity-60"></span> Normal Priority</div>
                    <div class="flex items-center gap-2"><span class="w-3 h-3 bg-gray-300 rounded-sm opacity-30 border border-gray-400"></span> No Active Reports</div>
                    <div class="mt-1 text-slate-400 italic text-[9px] text-center">Click building to zoom & filter</div>
                </div>
            </div>

            <!-- Details Form Panel (40%) -->
            <div class="w-full md:w-[40%] h-full bg-white flex flex-col overflow-hidden relative shadow-xl z-10">
                
                <!-- Desktop Empty State -->
                <div id="viewer-empty-state" class="hidden md:flex absolute inset-0 bg-white/90 backdrop-blur-[1px] z-50 flex-col items-center justify-center text-center p-8 transition-opacity duration-300">
                    <div class="bg-blue-50 p-4 rounded-full mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                        </svg>
                    </div>
                    <h3 class="text-lg font-medium text-slate-900">Select an Area</h3>
                    <p class="text-slate-500 text-sm mt-1 max-w-xs">Select a ticket from the sidebar or click a building on the map to view details.</p>
                </div>

                <!-- Report Header -->
                <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-white z-10">
                    <div>
                        <h2 id="display-id" class="text-xl font-bold text-slate-900">---</h2>
                        <p id="display-date" class="text-xs text-slate-500">---</p>
                    </div>
                    <div class="flex gap-2">
                        <span id="display-status" class="hidden px-3 py-1 bg-slate-100 text-slate-600 text-xs font-bold rounded-full border border-slate-200 uppercase tracking-wider">---</span>
                    </div>
                </div>

                <!-- Report Scrollable Content -->
                <div class="flex-1 overflow-y-auto p-6 space-y-6 no-scrollbar">
                    
                    <!-- Location Section -->
                    <div class="space-y-4">
                        <h3 class="text-sm font-bold uppercase tracking-wide text-blue-600">1. Location Details</h3>
                        <div class="grid grid-cols-1 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">Area / Main Building</label>
                                <input type="text" id="view-location" readonly class="w-full detail-input rounded-lg px-3 py-2 text-sm text-slate-900 font-semibold focus:outline-none cursor-default" />
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">Map ID</label>
                                    <input type="text" id="view-area-id" readonly class="w-full detail-input rounded-lg px-3 py-2 text-slate-600 font-mono text-xs cursor-default" />
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">Assigned Worker</label>
                                    <input type="text" id="view-assigned-to" readonly class="w-full detail-input rounded-lg px-3 py-2 text-slate-600 text-xs cursor-default" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="h-px bg-slate-100"></div>

                    <!-- Details Section -->
                    <div class="space-y-4">
                        <h3 class="text-sm font-bold uppercase tracking-wide text-slate-400">2. Report Details</h3>
                        
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Problem Type</label>
                            <input type="text" id="view-category" readonly class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 font-medium focus:outline-none" />
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Urgency</label>
                            <div class="flex gap-3 mt-1" id="view-urgency-container">
                                <div class="flex items-center gap-2 opacity-30 transition-opacity duration-300" id="urg-1">
                                    <div class="w-4 h-4 border-2 border-slate-300 rounded-full bg-green-600 border-green-600"></div>
                                    <span class="text-sm text-slate-600">Low</span>
                                </div>
                                <div class="flex items-center gap-2 opacity-30 transition-opacity duration-300" id="urg-2">
                                    <div class="w-4 h-4 border-2 border-slate-300 rounded-full bg-yellow-500 border-yellow-500"></div>
                                    <span class="text-sm text-slate-600">Med</span>
                                </div>
                                <div class="flex items-center gap-2 opacity-30 transition-opacity duration-300" id="urg-3">
                                    <div class="w-4 h-4 border-2 border-slate-300 rounded-full bg-red-600 border-red-600"></div>
                                    <span class="text-sm text-slate-600">High</span>
                                </div>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Description of Issue</label>
                            <textarea id="view-description" rows="4" readonly class="w-full detail-input rounded-lg px-3 py-2 text-sm outline-none resize-none text-slate-700"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Footer Actions -->
                <div id="action-footer" class="p-6 border-t border-slate-100 bg-slate-50 z-10 flex gap-3 hidden">
                    <!-- Buttons injected via JS based on State -->
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-[500] flex flex-col gap-2 pointer-events-none"></div>

      // --- 5. MAP INITIALIZATION ---
      const map = L.map('map', { zoomControl: false, minZoom: 15, maxZoom: 18 }).setView([35.49539, -97.54089], 16);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO', subdomains: 'abcd', maxZoom: 20 }).addTo(map);

      let geojsonLayer;
      let selectedLayer = null;

      // Styles
      function style(feature) {
        const buildingId = feature.properties.id;
        const hasActiveReport = activeBuildingIds.has(buildingId);
        
        let baseColor = feature.properties.color || '#3b82f6';
        let opacity = 0.1; 
        let fillOpacity = 0.1;
        let weight = 1;

        if (hasActiveReport) {
            opacity = 1;
            fillOpacity = 0.7;
            weight = 2;
        }

        return { fillColor: baseColor, color: baseColor, weight: weight, opacity: opacity, fillOpacity: fillOpacity };
      }

      // Init Map Layer with Click Logic
      geojsonLayer = L.geoJson(buildingsData, {
        renderer: L.svg({ padding: 2 }), 
        style: style,
        onEachFeature: function (feature, layer) {
          layer.bindTooltip(feature.properties.name, { 
              direction: 'center', 
              className: 'font-bold text-[10px] bg-white/90 backdrop-blur px-2 py-1 rounded shadow-sm border border-slate-200 text-slate-700' 
          });
          
          // CLICK TO FILTER LOGIC
          layer.on('click', function(e) {
            L.DomEvent.stopPropagation(e);
            const buildingName = feature.properties.name;
            const buildingId = feature.properties.id;
            
            // 1. Zoom to feature
            map.flyToBounds(layer.getBounds(), { padding: [50, 50], maxZoom: 18, duration: 0.8 });

            // 2. Update search
            const searchInput = document.getElementById('search-input');
            searchInput.value = buildingName;
            document.getElementById('clear-search').classList.remove('hidden');

            // 3. Filter List
            renderSidebar();

            // 4. Highlight visual
            if (selectedLayer) geojsonLayer.resetStyle(selectedLayer);
            selectedLayer = layer;
            layer.setStyle({ weight: 3, color: '#ef4444', fillOpacity: 0.9 });
            
            showToast(`<i class="fa-solid fa-filter"></i> Filtered by: ${buildingName}`, 'info');
          });
        }
      }).addTo(map);

      // Clear selection on map click
      map.on('click', function() {
        clearSearch();
      });

      // --- 6. CONTROLLER LOGIC ---

      function switchTab(tab) {
          currentTab = tab;
          const btnAll = document.getElementById('btn-filter-all');
          const btnAssigned = document.getElementById('btn-filter-assigned');
          const btnCompleted = document.getElementById('btn-filter-completed');
          
          const baseClass = "flex-1 py-1.5 text-[10px] font-bold rounded transition-colors text-slate-500 hover:text-slate-700";
          const activeClass = "flex-1 py-1.5 text-[10px] font-bold rounded shadow-sm bg-white text-blue-700";
          
          btnAll.className = baseClass;
          btnAssigned.className = baseClass;
          btnCompleted.className = baseClass;

          if(tab === 'all') btnAll.className = activeClass;
          if(tab === 'assigned') btnAssigned.className = activeClass;
          if(tab === 'completed') btnCompleted.className = activeClass;

          fetchReports();
      }

      function clearSearch() {
        document.getElementById('search-input').value = '';
        document.getElementById('clear-search').classList.add('hidden');
        if (selectedLayer) {
            geojsonLayer.resetStyle(selectedLayer);
            selectedLayer = null;
        }
        renderSidebar();
        updateMapHighlights(); // Restore active status
      }

      document.getElementById('search-input').addEventListener('input', function(e) {
        if(e.target.value) document.getElementById('clear-search').classList.remove('hidden');
        else document.getElementById('clear-search').classList.add('hidden');
        renderSidebar();
      });

      // --- 7. API INTERACTION ---

      async function fetchReports() {
        const container = document.getElementById('report-list-container');
        // Show simple loading indicator inside list if needed, or just let it refresh seamlessly
        // container.innerHTML = '<div class="text-center p-8 text-slate-400 text-sm">Loading...</div>';

        let url = '';
        if (currentTab === 'all') url = '/API/allReports';
        else if (currentTab === 'assigned') url = `/API/assignedReports?workerID=${WORKER_ID}`;
        else if (currentTab === 'completed') url = '/API/completedReports';

        try {
            const response = await fetch(url);
            const data = await response.json();

            if (data.success) {
                if (currentTab === 'all') {
                    // User snippet logic: filter out completed tasks from "All Requests"
                    currentReports = (data.reports || []).filter(r => r.completion !== true);
                } else if (currentTab === 'assigned') {
                    // User snippet logic: filter out completed tasks from "My Assigned"
                    currentReports = (data.assigned || []).filter(r => r.completion !== true);
                } else if (currentTab === 'completed') {
                    currentReports = data.completed || [];
                }
                
                // Update Map Highlights based on fetched data
                activeBuildingIds.clear();
                currentReports.forEach(report => {
                    const bId = findBuildingIdFromLocation(report.location);
                    if(bId) activeBuildingIds.add(bId);
                });
                if (!selectedLayer) updateMapHighlights();

                renderSidebar();
            } else {
                console.error("API Error:", data.error);
                showToast("Failed to load reports", "error");
            }
        } catch (error) {
            console.error("Network Error:", error);
            showToast("Network error. Please try again.", "error");
        }
      }

      async function handleAccept(id) {
        const btn = document.querySelector('#action-footer button');
        if(btn) {
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';
        }

        try {
            const response = await fetch('/API/assignReport', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ workerID: WORKER_ID, reportID: id })
            });
            const result = await response.json();
            
            if (result.success) {
                showToast(`<i class="fa-solid fa-check"></i> Task #${id} accepted!`, 'success');
                // Automatically switch to 'My Tasks' tab to show the newly assigned item
                switchTab('assigned');
                // We also need to select it again or clear selection? 
                // Let's fetch assigned reports and then maybe select it if it exists.
                // For now, switchTab calls fetchReports, which re-renders sidebar.
            } else {
                showToast("Failed: " + (result.error || "Unknown error"), "error");
                if(btn) { btn.disabled = false; btn.innerHTML = 'Accept Request'; }
            }
        } catch (e) {
            showToast("Network error", "error");
            if(btn) { btn.disabled = false; btn.innerHTML = 'Accept Request'; }
        }
      }

      async function handleComplete(id) {
        if(!confirm("Are you sure you want to finalize this report? This cannot be undone.")) return;

        const btn = document.querySelector('#action-footer button');
        if(btn) {
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Finalizing...';
        }

        const completionTime = new Date().toISOString();

        try {
            const response = await fetch(`/API/completeReport/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ completionTime })
            });
            const result = await response.json();

            if (result.success) {
                showToast(`<i class="fa-solid fa-flag-checkered"></i> Task #${id} completed!`, 'success');
                
                // Refresh data. If we are in 'assigned', this item will disappear.
                fetchReports();
                
                // Clear the detail view since the item is technically gone from this list
                document.getElementById('action-footer').classList.add('hidden');
                // Reset detail view inputs? Optional, but good UX.
                document.getElementById('viewer-empty-state').style.display = 'flex';
                document.getElementById('viewer-empty-state').classList.remove('hidden'); // Ensure flex is applied
            } else {
                showToast("Failed: " + (result.error || "Unknown error"), "error");
                if(btn) { btn.disabled = false; btn.innerHTML = 'Mark Complete'; }
            }
        } catch (e) {
            showToast("Network error", "error");
            if(btn) { btn.disabled = false; btn.innerHTML = 'Mark Complete'; }
        }
      }

      // --- 8. RENDERING ---

      function renderSidebar() {
        const container = document.getElementById('report-list-container');
        const searchVal = document.getElementById('search-input').value.toLowerCase();
        container.innerHTML = '';

        // Filter by Search
        let displayReports = currentReports;
        if (searchVal) {
            displayReports = displayReports.filter(r => 
                r.location.toLowerCase().includes(searchVal) || 
                String(r.reportID).includes(searchVal) ||
                r.description.toLowerCase().includes(searchVal)
            );
        }

        if (displayReports.length === 0) {
            let emptyMsg = "No reports found.";
            if(currentTab === 'completed' && !searchVal) emptyMsg = "No completed history.";
            else if(currentTab === 'assigned' && !searchVal) emptyMsg = "You have no active tasks.";
            container.innerHTML = `<div class="text-center p-8 text-slate-400 text-sm italic">${emptyMsg}</div>`;
            return;
        }

        displayReports.forEach(report => {
            const el = document.createElement('div');
            let statusText = "Pending";
            let statusColor = "bg-yellow-100 text-yellow-700";

            // Logic adapted from your snippet and previous requirements
            if (report.completion || report.completionTime) { // Handle both potential API formats
                statusText = "Completed";
                statusColor = "bg-green-100 text-green-700";
            } else if (String(report.assignedWorkerID) === String(WORKER_ID)) {
                statusText = "My Task";
                statusColor = "bg-blue-100 text-blue-700";
            } else if (report.assignedWorkerID) {
                statusText = "Assigned";
                statusColor = "bg-gray-100 text-gray-600";
            }
            
            const dateStr = new Date(report.submissionTime).toLocaleDateString();

            el.className = `report-item cursor-pointer p-4 border-b border-slate-100 ${selectedReportId === report.reportID ? 'active' : ''}`;
            el.innerHTML = `
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs font-mono font-medium text-slate-500">#${report.reportID}</span>
                    <span class="text-[10px] font-semibold text-slate-400">${dateStr}</span>
                </div>
                <div class="font-bold text-slate-800 text-sm mb-1 truncate">${report.location}</div>
                <div class="flex items-center justify-between mt-2">
                    <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${statusColor}">${statusText}</span>
                    <div class="text-xs text-slate-400">Priority ${report.priority}</div>
                </div>
            `;
            el.onclick = () => selectReport(report);
            container.appendChild(el);
        });
      }

      function selectReport(report) {
        selectedReportId = report.reportID;
        renderSidebar(); // Re-render to update active class

        // Mobile toggle
        if (window.innerWidth < 768) {
            document.getElementById('sidebar-panel').classList.add('hidden');
            const main = document.getElementById('main-panel');
            main.classList.remove('hidden');
            main.classList.add('flex');
        }

        document.getElementById('viewer-empty-state').style.display = 'none';
        document.getElementById('display-id').textContent = `Report #${report.reportID}`;
        document.getElementById('display-date').textContent = new Date(report.submissionTime).toLocaleString();
        
        document.getElementById('view-location').value = report.location;
        document.getElementById('view-category').value = report.category;
        document.getElementById('view-description').value = report.description;
        
        let assignedText = 'Unassigned';
        if(report.assignedWorkerID) assignedText = (String(report.assignedWorkerID) === String(WORKER_ID)) ? 'Assigned to Me' : `Worker ${report.assignedWorkerID}`;
        document.getElementById('view-assigned-to').value = assignedText;

        const badge = document.getElementById('display-status');
        if(report.completion || report.completionTime) {
            badge.textContent = "COMPLETED";
            badge.className = "px-3 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full border border-green-200 uppercase tracking-wider";
        } else if (String(report.assignedWorkerID) === String(WORKER_ID)) {
            badge.textContent = "IN PROGRESS";
            badge.className = "px-3 py-1 bg-blue-100 text-blue-700 text-xs font-bold rounded-full border border-blue-200 uppercase tracking-wider";
        } else if (report.assignedWorkerID) {
            badge.textContent = "ASSIGNED";
            badge.className = "px-3 py-1 bg-gray-100 text-gray-600 text-xs font-bold rounded-full border border-gray-200 uppercase tracking-wider";
        } else {
            badge.textContent = "PENDING";
            badge.className = "px-3 py-1 bg-yellow-100 text-yellow-700 text-xs font-bold rounded-full border border-yellow-200 uppercase tracking-wider";
        }
        badge.classList.remove('hidden');
        
        // Urgency indicators
        ['urg-1', 'urg-2', 'urg-3'].forEach(id => document.getElementById(id).style.opacity = '0.3');
        if (report.priority >= 1 && report.priority <= 3) {
            document.getElementById(`urg-${report.priority}`).style.opacity = '1';
        }

        // Update Map ID field
        const foundId = findBuildingIdFromLocation(report.location);
        document.getElementById('view-area-id').value = foundId || 'Unknown';

        // ZOOM LOGIC
        if (foundId) {
            geojsonLayer.eachLayer(layer => {
                if (layer.feature.properties.id === foundId) {
                    map.flyToBounds(layer.getBounds(), { padding: [50, 50], maxZoom: 18, duration: 0.8 });
                    
                    if (selectedLayer && selectedLayer !== layer) geojsonLayer.resetStyle(selectedLayer);
                    selectedLayer = layer;
                    layer.setStyle({ weight: 3, color: '#ef4444', fillOpacity: 0.9 });
                }
            });
        }

        // Render Footer Buttons
        const footer = document.getElementById('action-footer');
        footer.classList.remove('hidden');
        footer.innerHTML = '';

        // 1. Check Final State
        if (report.completion || report.completionTime) {
             footer.innerHTML = `<div class="w-full text-center text-sm text-green-600 font-bold bg-green-50 py-2 rounded border border-green-100 flex items-center justify-center gap-2"><i class="fa-solid fa-check-circle"></i> Report Finalized</div>`;
             return;
        }

        // 2. Check Assignment
        const btnClass = "flex-1 py-2 px-4 text-white font-semibold rounded-lg shadow-sm flex items-center justify-center gap-2 transition-all active:scale-95";

        if (String(report.assignedWorkerID) === String(WORKER_ID)) {
            // It's mine -> I can move it to Final State
            const btn = document.createElement('button');
            btn.className = `${btnClass} bg-green-600 hover:bg-green-700`;
            btn.innerHTML = `<i class="fa-solid fa-check"></i> Mark Complete`;
            btn.onclick = () => handleComplete(report.reportID);
            footer.appendChild(btn);
        } else if (!report.assignedWorkerID) {
            // Unassigned -> I can move to LoggedIn state
            const btn = document.createElement('button');
            btn.className = `${btnClass} bg-blue-600 hover:bg-blue-700`;
            btn.innerHTML = `<i class="fa-solid fa-hand-holding-hand"></i> Accept Request`;
            btn.onclick = () => handleAccept(report.reportID);
            footer.appendChild(btn);
        } else {
            // Someone else's task
            footer.innerHTML = `<div class="w-full text-center text-sm text-slate-400 italic bg-slate-100 py-2 rounded">Assigned to Worker #${report.assignedWorkerID}</div>`;
        }
      }

      // --- 9. HELPERS ---

      function showMobileList() {
        document.getElementById('sidebar-panel').classList.remove('hidden');
        const main = document.getElementById('main-panel');
        main.classList.add('hidden');
        main.classList.remove('flex');
        selectedReportId = null;
        renderSidebar(); // remove active class
      }

      function findBuildingIdFromLocation(locationStr) {
        if (!locationStr) return null;
        if (BUILDING_MAPPINGS[locationStr]) return BUILDING_MAPPINGS[locationStr];
        const lowerLoc = locationStr.toLowerCase();
        const feature = buildingsData.features.find(f => {
            const props = f.properties;
            return lowerLoc.includes(props.name.toLowerCase()) || props.name.toLowerCase().includes(lowerLoc);
        });
        return feature ? feature.properties.id : null;
      }

      function updateMapHighlights() {
        geojsonLayer.eachLayer(layer => {
            layer.setStyle(style(layer.feature));
        });
      }

      function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        const colors = {
            success: 'bg-green-600 border-green-700',
            error: 'bg-red-600 border-red-700',
            info: 'bg-slate-800 border-slate-900'
        };
        el.className = `${colors[type]} text-white px-4 py-3 rounded shadow-lg text-sm font-medium border toast-enter flex items-center gap-3 pointer-events-auto`;
        el.innerHTML = message;
        container.appendChild(el);
        requestAnimationFrame(() => el.classList.remove('toast-enter'));
        el.classList.add('toast-enter-active');
        setTimeout(() => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(10px)';
            setTimeout(() => el.remove(), 300);
        }, 3000);
      }

      // Boot - Load initial data
      fetchReports();
    </script>
  </body>
</html>
